{% load static %}
<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}CCK Recorder{% endblock %}</title>
    <meta name="description" content="CCK Recorder firmware distribution and guide platform" />
    <link rel="icon" type="image/svg+xml" href="{% static 'assets/favicon.svg' %}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="{% static 'css/styles.css' %}?v=20260221" rel="stylesheet" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand" href="/">
          <img src="{% static 'assets/cck-recorder-white.png' %}" alt="CCK Recorder" />
        </a>
        <button class="menu-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <nav class="site-nav" data-open="false">
          <a class="{% if request.path == '/' %}active{% endif %}" href="/">Home</a>
          <a class="{% if request.path == '/usage' %}active{% endif %}" href="/usage">How to use</a>
          <a class="{% if request.path == '/list' %}active{% endif %}" href="/list">Firmwares</a>
          <a class="{% if request.path == '/contact' %}active{% endif %}" href="/contact">Contact</a>
        </nav>
      </div>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div class="container footer-wrap">
        <p>Copyright &copy; CubingClubKorea</p>
        <a class="btn btn-ghost" href="/contact">문의하기</a>
      </div>
    </footer>

    <script src="{% static 'js/scripts.js' %}"></script>
  </body>
</html>
